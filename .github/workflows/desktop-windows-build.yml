name: Desktop Windows packaging

on:
  push:
    branches:
      - desktop-editor-foundation
    paths:
      - "desktop_app/**"
      - "ZENITH_Desktop.spec"
      - "build_windows.ps1"
      - "ZENITH_Desktop.iss"
      - ".github/workflows/desktop-windows-build.yml"
  workflow_dispatch:

jobs:
  windows-onedir:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows application using the user build script
        shell: pwsh
        run: .\build_windows.ps1
      - name: Verify packaged executable and FFmpeg payload
        shell: pwsh
        run: |
          $app = "dist/ZENITH Desktop"
          if (-not (Test-Path "$app/ZENITH Desktop.exe")) {
            throw "Packaged application executable is missing."
          }
          $ffmpeg = Get-ChildItem $app -Recurse -File |
            Where-Object { $_.Name -match '^ffmpeg.*\.exe$' }
          if (-not $ffmpeg) {
            throw "Bundled FFmpeg executable is missing."
          }
          Write-Host "Executable and bundled FFmpeg found."
          $ffmpegPath = $ffmpeg[0].FullName
          & $ffmpegPath -version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled FFmpeg could not start successfully."
          }
          & $ffmpegPath -hide_banner -loglevel error -f lavfi -i "color=c=black:s=64x64:d=0.2" -frames:v 1 -f null NUL
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled FFmpeg failed its lavfi frame-processing smoke test."
          }
          $smokeMp4 = Join-Path $env:RUNNER_TEMP "zenith-ffmpeg-smoke.mp4"
          & $ffmpegPath -y -hide_banner -loglevel error -f lavfi -i "testsrc2=size=96x64:rate=25:duration=1" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -threads 1 -pix_fmt yuv420p -c:a aac -shortest $smokeMp4
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smokeMp4)) {
            throw "Bundled FFmpeg failed to encode a test H.264/AAC MP4."
          }
          & $ffmpegPath -hide_banner -loglevel error -i $smokeMp4 -map 0:v:0 -map 0:a:0 -f null NUL
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled FFmpeg failed to decode the test H.264/AAC MP4."
          }
          Write-Host "Bundled FFmpeg version, frame-processing, H.264/AAC encode and decode smoke tests passed."
      - name: Smoke-test packaged desktop startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/ZENITH Desktop/ZENITH Desktop.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "zenith-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "zenith-smoke.stderr.log"
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                Write-Host "Application exited during startup with code $($process.ExitCode)."
                if (Test-Path $stdout) { Get-Content $stdout }
                if (Test-Path $stderr) { Get-Content $stderr }
                throw "Packaged desktop application failed its startup smoke test."
              }
              if ($process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -like "*ZENITH Desktop*") {
                $windowReady = $true
                break
              }
            }
            if (-not $windowReady) {
              Write-Host "Process is alive but its main window was not detected."
              Write-Host "Window title: $($process.MainWindowTitle)"
              throw "Packaged desktop application did not expose its expected main window."
            }
            Write-Host "Main window detected: $($process.MainWindowTitle)"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
          & $compiler ZENITH_Desktop.iss
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed." }
          if (-not (Test-Path "dist-installer/ZENITH-Desktop-Setup.exe")) { throw "Installer output is missing." }
      - name: Smoke-test Windows installer install and uninstall
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist-installer/ZENITH-Desktop-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "ZENITH Desktop Smoke"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer exited with code $($install.ExitCode)." }
          $installedExe = Join-Path $installDir "ZENITH Desktop.exe"
          if (-not (Test-Path $installedExe -PathType Leaf)) { throw "Installed application executable is missing." }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "Application uninstaller is missing." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller exited with code $($uninstall.ExitCode)." }
          if (Test-Path $installDir) { throw "Application install directory remains after uninstall." }
          Write-Host "Windows installer install/uninstall smoke test passed."
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: zenith-desktop-windows-installer
          path: dist-installer/ZENITH-Desktop-Setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-desktop-windows-unsigned
          path: dist/ZENITH Desktop/
          if-no-files-found: error
          retention-days: 7
