      - "desktop_app/color_wheel_widget.py"
      - "desktop_app/test_color_wheel_math.py"
      - "desktop_app/test_color_preview.py"
      - "desktop_app/test_audio_meter.py"
      - "desktop_app/test_audio_render.py"
      - "desktop_app/waveform_manager.py"
      - "desktop_app/test_waveform_manager.py"
      - "desktop_app/test_proxy_manager.py"
      - "desktop_app/test_media_probe.py"
      - "desktop_app/test_timeline_model.py"
      - "desktop_app/color_wheel_math.py"
      - "desktop_app/color_wheel_widget.py"
      - "desktop_app/test_color_wheel_math.py"
      - "desktop_app/main.py"
      - "desktop_app/polygon_mask_overlay.py"
      - "desktop_app/bezier_curve_widget.py"
      - "desktop_app/bezier_curve_math.py"
      - "desktop_app/test_bezier_curve_math.py"
      - "desktop_app/timeline_widget.py"
      - "desktop_app/main.py"
      - "desktop_app/polygon_mask_overlay.py"
      - "desktop_app/video_render.py"
      - "desktop_app/render_validation.py"
      - "desktop_app/test_render_validation.py"
      - "desktop_app/speed_ramp.py"
      - "desktop_app/test_speed_ramp.py"
      - "desktop_app/speed_ramp_preview.py"
      - "desktop_app/test_speed_ramp_preview.py"
      - "desktop_app/test_video_render.py"
      - "desktop_app/test_video_render_integration.py"
      - ".github/workflows/desktop-model-tests.yml"
  pull_request:
    paths:
      - "desktop_app/ai_editor/**"
      - "desktop_app/proxy_manager.py"
      - "desktop_app/test_proxy_manager.py"
      - "desktop_app/waveform_manager.py"
      - "desktop_app/test_waveform_manager.py"
      - "desktop_app/audio_meter.py"
      - "desktop_app/test_audio_meter.py"
      - "desktop_app/timeline_model.py"
      - "desktop_app/test_timeline_model.py"
