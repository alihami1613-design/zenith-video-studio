name: Desktop timeline model tests

on:
  push:
    branches:
      - desktop-editor-foundation
    paths:
      - "desktop_app/timeline_model.py"
      - "desktop_app/media_probe.py"
      - "desktop_app/proxy_manager.py"
      - "desktop_app/waveform_manager.py"
      - "desktop_app/test_waveform_manager.py"
      - "desktop_app/test_proxy_manager.py"
      - "desktop_app/test_media_probe.py"
      - "desktop_app/test_timeline_model.py"
      - "desktop_app/main.py"
      - "desktop_app/timeline_widget.py"
      - ".github/workflows/desktop-model-tests.yml"
  pull_request:
    paths:
      - "desktop_app/proxy_manager.py"
      - "desktop_app/test_proxy_manager.py"
      - "desktop_app/waveform_manager.py"
      - "desktop_app/test_waveform_manager.py"
      - "desktop_app/timeline_model.py"
      - "desktop_app/test_timeline_model.py"
      - "desktop_app/main.py"
      - "desktop_app/timeline_widget.py"
      - ".github/workflows/desktop-model-tests.yml"

jobs:
  timeline-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run timeline model tests
        run: python -m unittest discover -s desktop_app -p "test_*.py"
