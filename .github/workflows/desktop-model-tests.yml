      - "desktop_app/polygon_mask_overlay.py"
      - "desktop_app/bezier_curve_widget.py"
      - "desktop_app/timeline_widget.py"
      - "desktop_app/video_render.py"
      - "desktop_app/test_video_render.py"
      - "desktop_app/test_video_render_integration.py"
      - ".github/workflows/desktop-model-tests.yml"

jobs:
  timeline-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy for local spectral analysis
        run: python -m pip install "numpy>=1.26,<3"
      - name: Install FFmpeg for render integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile desktop Python modules
        run: python -m compileall -q desktop_app
      - name: Run timeline model and render tests
        run: python -m unittest discover -s desktop_app -p "test_*.py"
